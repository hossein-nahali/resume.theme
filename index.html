<!doctype html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="src/css/style.css">
    <title>resume theme</title>
</head>
<body>
<main>
    <section class="content">
        <div class="container">
            <div class="content-container">
                <aside class="sidebar">
                    <div class="profile">
                        <img src="src/img/me.jpg" alt="profile">
                        <div class="name">
                            <h1>Hossein Nahali</h1>
                            <p>Front-End Developer</p>
                        </div>
                    </div>
                    <ul class="information">
                        <li>
                            <div class="icon">
                                <img src="src/img/mail.svg" alt="mail">
                            </div>
                            <div class="content">
                                <span>Email</span>
                                <a href="#">nahali.dev@gmail.com</a>
                            </div>
                        </li>
                        <li>
                            <div class="icon">
                                <img src="src/img/phone.svg" alt="phone">
                            </div>
                            <div class="content">
                                <span>Phone</span>
                                <a href="#">(+98) 936 907 9925</a>
                            </div>
                        </li>
                        <li>
                            <div class="icon">
                                <img src="src/img/location.svg" alt="location">
                            </div>
                            <div class="content">
                                <span>Address</span>
                                <p>Iran, Esfahan</p>
                            </div>
                        </li>
                    </ul>
                    <div class="socials">
                        <h3>Socials</h3>
                        <ul>
                            <li>
                                <a href="#">
                                    <div class="icon">
                                        <img src="src/img/instagram.svg" alt="instagram">
                                    </div>
                                    <div class="content">
                                        <span>Instagram</span>
                                        <p>@hosseinNahali</p>
                                    </div>
                                </a>
                            </li>
                            <li>
                                <a href="#">
                                    <div class="icon">
                                        <img src="src/img/linkedin.svg" alt="linkedin">
                                    </div>
                                    <div class="content">
                                        <span>Linkedin</span>
                                        <p>hossein-nahali</p>
                                    </div>
                                </a>
                            </li>
                        </ul>
                    </div>
                </aside>
                <div class="section-content">
                    content
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
